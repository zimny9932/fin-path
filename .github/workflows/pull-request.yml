name: Pull Request

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend
        with:
          node-version: 20
          working-directory: frontend

      - name: Lint
        run: npm run lint

  unit-test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      APP_ENV: test
      APP_SECRET: ${{ secrets.APP_SECRET || 'test-secret' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://app:app@127.0.0.1:5432/fin_path?serverVersion=17&charset=utf8' }}
      CORS_ALLOW_ORIGIN: ${{ secrets.CORS_ALLOW_ORIGIN || '' }}
      DEFAULT_URI: ${{ secrets.DEFAULT_URI || '' }}
      JWT_PASSPHRASE: ${{ secrets.JWT_PASSPHRASE || '' }}
      VAR_DUMPER_SERVER: ${{ secrets.VAR_DUMPER_SERVER || '' }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fin_path
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d fin_path"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup backend
        uses: ./.github/actions/setup-backend
        with:
          php-version: 8.4

      - name: Wait for database
        env:
          PGPASSWORD: app
        run: |
          for i in {1..40}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U app -d fin_path; then
              exit 0
            fi
            sleep 5
          done
          echo "Database not ready" >&2
          docker ps --format '{{.Names}} {{.Status}}' --filter name=postgres || true
          docker logs postgres || true
          exit 1

      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Load fixtures
        run: php bin/console doctrine:fixtures:load --no-interaction

      - name: Prepare coverage directory
        run: mkdir -p var/coverage-phpunit

      - name: Run PHPUnit
        run: php -d memory_limit=-1 ./bin/phpunit --coverage-clover var/coverage-phpunit/coverage.xml --coverage-html var/coverage-phpunit/html

      - name: Upload PHPUnit coverage
        if: always() && hashFiles('var/coverage-phpunit/coverage.xml') != ''
        uses: actions/upload-artifact@v6
        with:
          name: phpunit-coverage
          path: |
            var/coverage-phpunit/coverage.xml
            var/coverage-phpunit/html
          retention-days: 7

  e2e-test:
    runs-on: ubuntu-latest
    needs: lint
    environment: integration
    defaults:
      run:
        working-directory: frontend
    env:
      APP_ENV: integration
      APP_SECRET: ${{ secrets.APP_SECRET || '' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL || '' }}
      DEFAULT_URI: ${{ secrets.DEFAULT_URI || '' }}
      JWT_PASSPHRASE: ${{ secrets.JWT_PASSPHRASE || '' }}
      CORS_ALLOW_ORIGIN: ${{ secrets.CORS_ALLOW_ORIGIN || '' }}
      VAR_DUMPER_SERVER: ${{ secrets.VAR_DUMPER_SERVER || '' }}
      PLAYWRIGHT_HOST: ${{ secrets.PLAYWRIGHT_HOST || 'localhost' }}
      PLAYWRIGHT_PORT: ${{ secrets.PLAYWRIGHT_PORT || '3000' }}
      PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL || '' }}
      NODE_V8_COVERAGE: ${{ github.workspace }}/frontend/coverage/playwright
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend
        with:
          node-version: 20
          working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright e2e tests
        run: npx playwright test --config=playwright.config.ts --reporter=html

      - name: Upload Playwright report
        if: always() && hashFiles('frontend/playwright-report/index.html') != ''
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Upload Playwright coverage
        if: always() && hashFiles('frontend/coverage/playwright/**') != ''
        uses: actions/upload-artifact@v6
        with:
          name: playwright-coverage
          path: frontend/coverage/playwright
          retention-days: 7

  status-comment:
    runs-on: ubuntu-latest
    needs: [lint, unit-test, e2e-test]
    if: ${{ success() }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post status comment
        uses: actions/github-script@v8
        env:
          LINT_STATUS: ${{ needs.lint.result }}
          UNIT_STATUS: ${{ needs['unit-test'].result }}
          E2E_STATUS: ${{ needs['e2e-test'].result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { LINT_STATUS, UNIT_STATUS, E2E_STATUS } = process.env;
            const lines = [
              `Workflow status for #${context.issue.number}:`,
              `- Lint: ${LINT_STATUS}`,
              `- Unit (PHPUnit): ${UNIT_STATUS}`,
              `- E2E (Playwright): ${E2E_STATUS}`,
              'Artifacts:',
              '• phpunit-coverage',
              '• playwright-report',
              '• playwright-coverage',
            ];
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.name,
              body: lines.join('\n'),
            });
